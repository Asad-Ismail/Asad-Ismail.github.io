<article class="writing-row">
<p class="post-meta">
<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time> · {{ .Params.publication | default "Personal blog" }}</p>
<h3>
<a href="{{ .Params.externalLink | default .RelPermalink }}">{{ .Title }} <span aria-hidden="true">↗</span>
</a>
</h3>
<p>{{ .Description }}</p>
</article>
