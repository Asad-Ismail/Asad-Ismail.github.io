<li class="writing-row">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
  <div>
    <a href="{{ .Params.externalLink | default .RelPermalink }}">{{ .Title }}</a>
    {{ with .Params.publication }}<span class="publication">{{ if eq . "Prosus AI Tech Blog" }}Prosus{{ else }}{{ . }}{{ end }}</span>{{ end }}
  </div>
</li>
