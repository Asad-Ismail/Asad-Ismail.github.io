{{ define "content" }}
<section class="wrap archive">
  <header class="page-heading">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "posts" }}<p>My posts here and on Medium, most recent first.</p>{{ end }}
    {{ .Content }}
  </header>
  <ul class="writing-list">
    {{ range .Paginator.Pages }}{{ partial "writing-row.html" . }}{{ end }}
  </ul>
  {{ template "_internal/pagination.html" . }}
</section>
{{ end }}
